name: Diagnóstico público de acceso GDA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-gda-public.yml'
permissions:
  contents: read
jobs:
  detectar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Revisar respuesta pública sin autenticarse
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,html.parser
          class FormReader(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms=[]
                  self.fields=[]
                  self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="form":self.forms.append({"method":a.get("method","get"),"action_path":urllib.parse.urlparse(a.get("action","")).path})
                  if tag=="input":self.fields.append({"type":a.get("type","text"),"name_present":bool(a.get("name"))})
                  if tag=="script" and a.get("src"):self.scripts.append(urllib.parse.urlparse(a["src"]).path)
          url="https://gda.spymovil.com/"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatibility check)","Accept":"text/html"})
          try:
              with urllib.request.urlopen(req,timeout=25) as r:
                  data=r.read(200000)
                  parsed=FormReader()
                  parsed.feed(data.decode('utf-8','replace'))
                  print("HTTP",r.status)
                  print("Final host",urllib.parse.urlparse(r.url).hostname)
                  print("Response content type",r.headers.get("Content-Type","unknown").split(';')[0])
                  print("Page title",re.findall(r"<title[^>]*>([^<]*)</title>",data.decode('utf-8','replace'),flags=re.I)[:1])
                  print("Forms",parsed.forms[:3])
                  print("Input types",sorted([f["type"] for f in parsed.fields])[:15])
                  print("Script paths",parsed.scripts[:10])
                  print("HTML bytes",len(data))
          except Exception as e:
              print("Public endpoint unavailable",type(e).__name__,str(e)[:150])
          PY
