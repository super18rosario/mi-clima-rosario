name: GDA - prueba de acceso privado
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revisar_acceso:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnosticar portal GDA de forma privada
        env:
          GDA_USERNAME: ${{ secrets.GDA_USERNAME }}
          GDA_PASSWORD: ${{ secrets.GDA_PASSWORD }}
        run: python scripts/gda_probe.py
