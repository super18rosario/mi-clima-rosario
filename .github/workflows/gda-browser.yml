name: GDA - prueba segura con navegador
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador de prueba
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright install chromium
      - name: Validar navegación tras el ingreso sin modificar estaciones
        env:
          GDA_USERNAME: ${{ secrets.GDA_USERNAME }}
          GDA_PASSWORD: ${{ secrets.GDA_PASSWORD }}
        run: python scripts/gda_browser_probe.py
