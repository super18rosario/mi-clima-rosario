name: Rosario SC - temperatura propia
on:
  workflow_dispatch:
  schedule:
    # Intervalo solicitado de 10 minutos, fuera de los minutos de mayor congestión.
    # GitHub puede retrasar u omitir ejecuciones; no garantiza tiempo real.
    - cron: '7,17,27,37,47,57 * * * *'
# Solo guarda datos en el repositorio. La página lee la lectura más reciente
# desde raw.githubusercontent.com, por lo que no hace falta desplegar Pages
# cada 10 minutos (el despliegue fallaba en cerca de la mitad de las ejecuciones).
permissions:
  contents: write
concurrency:
  group: rosariosc-actualizar
  cancel-in-progress: false
jobs:
  temperatura:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Diagnosticar inicio de ejecución
        run: |
          echo "Inicio UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Antigüedad de la última lectura guardada
        run: |
          python - <<'PY'
          import datetime as dt, json, pathlib
          try:
              d = json.loads(pathlib.Path("data/rosariosc.json").read_text(encoding="utf-8"))
              at = dt.datetime.fromisoformat(d["observed_at_utc"].replace("Z", "+00:00"))
              mins = (dt.datetime.now(dt.timezone.utc) - at).total_seconds() / 60
              print(f"Última lectura en repositorio: {at.isoformat()} (hace {mins:.0f} min)")
              if mins > 30:
                  print("::warning::Rosario SC sin lectura nueva desde hace más de 30 min")
          except Exception as exc:
              print("::warning::No se pudo determinar antigüedad:", type(exc).__name__)
          PY
      - name: Probar validación de mediciones Rosario SC
        run: python -m unittest discover -s tests -p 'test_*rosariosc.py' -v
      - name: Consultar estación propia
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: python scripts/current_rosariosc.py
      - name: Publicar solo observaciones válidas
        id: actualizacion
        shell: bash
        run: |
          if [ ! -f data/rosariosc.json ]; then
            echo "Sin observación válida; conservando respaldo"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp data/rosariosc.json /tmp/rosariosc.json
          git config user.name 'mi-clima-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          publicado=0
          cambiado=0
          for intento in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_rosariosc.py /tmp/rosariosc.json data/rosariosc.json data/rosariosc_history
            git add data/rosariosc.json data/rosariosc_history
            if git diff --cached --quiet; then publicado=1; break; fi
            git commit -m 'datos: temperatura Rosario SC [skip ci]'
            if git push origin HEAD:main; then publicado=1; cambiado=1; break; fi
          done
          test "$publicado" -eq 1
          if [ "$cambiado" -eq 1 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
