name: Diagnostico fuente INIA hora real
on:
  push:
    paths:
      - scripts/probe_inia_live.py
      - .github/workflows/probe-inia-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_inia_live.py
