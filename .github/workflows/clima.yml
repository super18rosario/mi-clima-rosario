name: Mi Clima Rosario - recopilación y publicación
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    # Cada tres horas. La tarea programada puede demorarse en GitHub Actions.
    - cron: '23 0,3,9,12,15,18,21 * * *'
    # Observaciones oficiales una vez al día, al haber terminado el día anterior.
    - cron: '23 6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mi-clima-publicar
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sincronizar rama antes de recopilar
        run: git pull --ff-only origin main
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar integridad del recolector
        run: python -m unittest discover -s tests -v
      - name: Verificar JavaScript de la aplicación
        run: |
          python -c 'from pathlib import Path; s=Path("index.html").read_text(); Path("/tmp/mi-clima-ui.js").write_text(s.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/mi-clima-ui.js
      - name: Probar selección provisional de máxima y mínima
        run: node tests/test_temperature_choice.cjs
      - name: Recopilar pronóstico
        run: python scripts/collect.py
      - name: Consultar temperatura medida INUMET / INIA
        run: python scripts/current_inia.py
      - name: Incorporar observaciones y evaluar
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '23 6 * * *')
        run: python scripts/observe.py
      - name: Actualizar observaciones INIA La Estanzuela (09 a 09, independientes)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '23 6 * * *')
        run: python scripts/inia.py
      - name: Recalcular aciertos con datos oficiales archivados (sin red)
        run: python scripts/recompute_skill.py
      - name: Guardar histórico
        shell: bash
        run: |
          git config user.name 'mi-clima-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m 'datos: pronóstico diario [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preparar página pública
        shell: bash
        run: |
          mkdir -p _publish
          cp index.html manifest.webmanifest icon-192.png icon-512.png service-worker.js _publish/
          cp -R data _publish/
          touch _publish/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir página
        uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
