name: INIA - verificar origen de temperatura horaria
on:
  push:
    paths:
      - scripts/probe_inia_realtime.py
      - .github/workflows/probe-inia-realtime.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar enlaces públicos INIA
        run: python scripts/probe_inia_realtime.py
