name: Pruebas automáticas
# Solo lectura: verifica un pull request (o la rama elegida) antes de fusionarlo.
# No recopila datos, no guarda nada y no publica la página.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas Python
        run: python -m unittest discover -s tests -v
      - name: Sintaxis JavaScript de la aplicación
        run: |
          python -c 'from pathlib import Path; s=Path("index.html").read_text(); Path("/tmp/mi-clima-ui.js").write_text(s.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/mi-clima-ui.js
      - name: Selector de máximas y mínimas
        run: node tests/test_temperature_choice.cjs
