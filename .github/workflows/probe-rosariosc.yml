name: Diagnostico RosarioSC Weathercloud (solo lectura)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-rosariosc.yml'
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnosticar respuesta publica sin credenciales
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, datetime, hashlib
          station='1547222571'
          url='https://app.weathercloud.net/device/values?code='+station
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Referer':'https://app.weathercloud.net/d'+station})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  print('HTTP_STATUS:',response.status,flush=True)
                  print('CONTENT_TYPE:',response.headers.get('Content-Type'),flush=True)
                  payload=response.read(32768)
          except urllib.error.HTTPError as e:
              print('DIAGNOSTICO: HTTP_ERROR',e.code,'content_type',e.headers.get('Content-Type'),flush=True)
              raise SystemExit(1)
          except Exception as e:
              print('DIAGNOSTICO: NETWORK_ERROR',type(e).__name__,str(e)[:160],flush=True)
              raise SystemExit(1)
          print('BYTES:',len(payload),'SHA256:',hashlib.sha256(payload).hexdigest()[:16],flush=True)
          try:
              data=json.loads(payload)
          except (ValueError,UnicodeError):
              print('DIAGNOSTICO: NOT_JSON; no se publica contenido de respuesta',flush=True)
              raise SystemExit(1)
          if not isinstance(data,dict):
              print('DIAGNOSTICO: JSON_NOT_OBJECT',type(data).__name__,flush=True)
              raise SystemExit(1)
          print('JSON_KEYS:',sorted(str(k) for k in data)[:40],flush=True)
          temp=data.get('temp')
          epoch=data.get('epoch')
          print('TEMP_TYPE:',type(temp).__name__,'EPOCH_TYPE:',type(epoch).__name__,flush=True)
          if type(temp) not in (int,float) or not (-40<temp<60):
              print('DIAGNOSTICO: TEMP_MISSING_OR_INVALID',flush=True)
              raise SystemExit(1)
          if type(epoch) not in (int,float):
              print('DIAGNOSTICO: TIMESTAMP_MISSING_OR_INVALID',flush=True)
              raise SystemExit(1)
          try:
              age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromtimestamp(epoch,datetime.timezone.utc)).total_seconds()/60
          except (ValueError,OverflowError,OSError):
              print('DIAGNOSTICO: TIMESTAMP_OUT_OF_RANGE',flush=True)
              raise SystemExit(1)
          print('AGE_MINUTES:',round(age,1),flush=True)
          if not (0<=age<=30):
              print('DIAGNOSTICO: STALE_OR_FUTURE',flush=True)
              raise SystemExit(1)
          print('ROSARIOSC_VALIDADA:',round(temp,1),'C',flush=True)
          PY
