name: GOES-19 - observación horaria de rayos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rayos.yml'
      - 'scripts/lightning.py'
      - 'tests/test_lightning.py'
  schedule:
    # Casi cada hora; GitHub Actions puede demorar la ejecución.
    - cron: '46 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mi-clima-publicar
  cancel-in-progress: false
jobs:
  rayos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector NetCDF
        run: python -m pip install --disable-pip-version-check netCDF4==1.7.4
      - name: Probar criterios de integridad
        run: python -m unittest discover -s tests -p test_lightning.py -v
      - name: Consultar rayos detectados por NOAA
        run: python scripts/lightning.py
      - name: Guardar observación
        shell: bash
        run: |
          git config user.name 'mi-clima-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lightning.json
          if ! git diff --cached --quiet; then
            git commit -m 'datos: rayos observados por GOES-19 [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preparar página pública
        shell: bash
        run: |
          mkdir -p _publish
          cp index.html manifest.webmanifest icon-192.png icon-512.png service-worker.js _publish/
          cp -R data _publish/
          touch _publish/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir página
        uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
      - name: Publicar página
        uses: actions/deploy-pages@v4
        id: deployment
